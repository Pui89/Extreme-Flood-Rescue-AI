<rect x="714" y="169" width="112" height="43" rx="11" fill="url(#metal)" stroke="#d3e0e4" stroke-width="3"/><path d="M727 181H813L804 199H736Z" fill="url(#lens)" stroke="#65d9ed" stroke-width="2"/><circle cx="742" cy="190" r="6" fill="#102e40" stroke="#c5f9ff" stroke-width="2"/><circle cx="773" cy="190" r="6" fill="#102e40" stroke="#c5f9ff" stroke-width="2"/><circle cx="800" cy="190" r="4" fill="#102e40" stroke="#c5f9ff" stroke-width="2"/><path d="M741 166Q770 146 799 166L794 175H746Z" fill="#b8c8ce" stroke="#edf4f6" stroke-width="2"/><ellipse cx="770" cy="163" rx="25" ry="7" fill="#4f6b78" stroke="#d5e1e5" stroke-width="2"/>
<!-- technical callouts -->
<path class="call" d="M824 186H1070V160H1150"/><circle cx="824" cy="186" r="4" fill="#6de1ed"/><text x="1165" y="154" class="label">MULTI-SENSOR HEAD</text><text x="1165" y="176" class="small">RGB • DEPTH • OPTIONAL THERMAL</text><text x="1165" y="196" class="small">Situational-awareness concept</text>
<path class="call" d="M951 374L1100 312H1150"/><circle cx="951" cy="374" r="4" fill="#6de1ed"/><text x="1165" y="306" class="label">SEALED CENTRAL POD</text><text x="1165" y="328" class="small">Protected electronics enclosure</text><text x="1165" y="348" class="small">Sealing level requires testing</text>
<path class="call" d="M846 470L1090 482H1150"/><circle cx="846" cy="470" r="4" fill="#6de1ed"/><text x="1165" y="476" class="label">MODULAR PAYLOAD</text><text x="1165" y="498" class="small">First aid • radio • flotation aid</text><text x="1165" y="518" class="small">Responder-controlled handoff</text>
<path class="call" d="M1130 635L1200 600H1250"/><circle cx="1130" cy="635" r="4" fill="#6de1ed"/><text x="1260" y="594" class="label">BUOYANCY PODS</text><text x="1260" y="616" class="small">Optional stability concept</text><text x="1260" y="636" class="small">Not a certified flotation system</text>
<path class="call" d="M557 633L440 590H280"/><circle cx="557" cy="633" r="4" fill="#6de1ed"/><text x="70" y="578" class="label">ARTICULATED LIMBS</text><text x="70" y="600" class="small">Adaptive foothold concept</text><text x="70" y="620" class="small">Gait and stability need validation</text>
<path class="call" d="M610 409L460 350H280"/><circle cx="610" cy="409" r="4" fill="#6de1ed"/><text x="70" y="330" class="label">HIGH-VISIBILITY MARKERS</text><text x="70" y="352" class="small">Rescue-orange panels and lights</text><text x="70" y="372" class="small">Proposed, not certified equipment</text>
<!-- footer -->
<g><rect x="60" y="790" width="470" height="82" rx="5" fill="#102534" stroke="#436878"/><text x="82" y="818" class="label">MISSION PROFILE</text><text x="82" y="844" class="small">SCOUT • MAP HAZARDS • CARRY SUPPLIES • RELAY LOCATION</text><text x="82" y="862" class="small">Trained responders make all rescue decisions.</text></g>
<g><rect x="550" y="790" width="470" height="82" rx="5" fill="#102534" stroke="#436878"/><text x="572" y="818" class="label">DESIGN INTENT</text><text x="572" y="844" class="small">MODULAR, SERVICEABLE, LOW-SPEED FIELD ROBOT</text><text x="572" y="862" class="small">Quadruped mobility plus optional buoyancy aids.</text></g>
<g><rect x="1040" y="790" width="495" height="82" rx="5" fill="#2a211b" stroke="#b9783d"/><text x="1062" y="818" font-family="Arial" font-size="16" font-weight="700" fill="#ffc477" letter-spacing="1.5">ENGINEERING LIMIT</text><text x="1062" y="844" font-family="Arial" font-size="13" fill="#e4c6a1">Illustrative geometry only. No verified depth, payload,</text><text x="1062" y="862" font-family="Arial" font-size="13" fill="#e4c6a1">waterproofing, stability, autonomy or rescue performance.</text></g>
<text x="62" y="943" class="small">Sensor options depend on cost, environmental sealing and test results.</text><text x="1535" y="943" text-anchor="end" class="small">PUI89 • CONCEPT SHEET 01 • 2026</text>
</svg>