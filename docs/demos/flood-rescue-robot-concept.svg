<text x="62" y="58" class="sub">PUI89 / FIELD ROBOTICS</text><text x="62" y="100" class="head">FLOOD RESPONSE PLATFORM</text><text x="64" y="121" class="sub">HYBRID QUADRUPED • FLOOD-ENVIRONMENT CONCEPT • HUMAN-LED RESCUE</text>
<rect x="1260" y="43" width="275" height="50" rx="5" fill="#f4a64c" fill-opacity=".12" stroke="#f4a64c" stroke-opacity=".7"/><text x="1397" y="64" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffc477" letter-spacing="2">CONCEPT DESIGN</text><text x="1397" y="82" text-anchor="middle" font-family="Arial" font-size="11" fill="#e7c99f">NOT BUILT OR FIELD-TESTED</text>
