<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Flood Rescue Robot — Realistic Industrial Design Concept</title>
<desc id="desc">A technical concept sheet of a rugged hybrid quadruped flood-response robot with sensor mast, sealed body, modular rescue bay, articulated legs, and optional flotation pods. Not a validated physical robot.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#183243"/></linearGradient>
 <linearGradient id="shell" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#edf2f3"/><stop offset=".35" stop-color="#9aadb7"/><stop offset=".7" stop-color="#536c79"/><stop offset="1" stop-color="#243c49"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#506b78"/><stop offset="1" stop-color="#132b38"/></linearGradient>
 <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7fbff"/><stop offset=".45" stop-color="#35b8d0"/><stop offset="1" stop-color="#12374d"/></linearGradient>
 <linearGradient id="rescue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd887"/><stop offset="1" stop-color="#e36b22"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8bb5c5" stroke-opacity=".08"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
 <style>
