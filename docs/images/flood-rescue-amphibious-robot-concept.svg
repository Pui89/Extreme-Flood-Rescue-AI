<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Flood Rescue AI — Himalayan extreme-flood concept</title><desc id="desc">Illustrative Himalayan valley with inundated settlement, aerial reconnaissance drone, a rescue craft in a safer channel, and a ground robot held on higher ground. 15 metres is a simulation scenario, not a verified robot rating.</desc>
