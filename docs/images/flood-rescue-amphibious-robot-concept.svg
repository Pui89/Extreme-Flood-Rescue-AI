<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Flood Rescue AI — concept of an amphibious reconnaissance robot assisting emergency responders</title>
<desc id="desc">Original vector concept illustration of a compact tracked amphibious robot with sensor mast in a flooded mixed urban and rural landscape. A drone surveys overhead and a responder communicates with a resident from a safe raised area. Concept artwork only, not a real deployment or validated hardware.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10223d"/><stop offset=".62" stop-color="#527b91"/><stop offset="1" stop-color="#c0d7d5"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#59b7c9"/><stop offset="1" stop-color="#174968"/></linearGradient>
 <linearGradient id="shell" x2=".8" y2="1"><stop stop-color="#f3f4e8"/><stop offset=".48" stop-color="#b8c7c9"/><stop offset="1" stop-color="#657f91"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#8ce8f2"/><stop offset="1" stop-color="#1d597d"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
 <pattern id="rain" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M12 0L2 28 M54 26L44 54" stroke="#d9f6fa" stroke-width="2" opacity=".25"/></pattern>
</defs>
