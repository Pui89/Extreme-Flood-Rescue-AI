<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Flood Rescue AI — amphibious rescue robot concept</title>
<desc id="desc">Original vector concept illustration of an amphibious tracked flood-response robot with RGB and thermal cameras, LiDAR, flotation pontoons, a rescue supply pod, floodwater, a stranded-person marker, and a remote human coordinator. Research concept only.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#24566a"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168aad"/><stop offset="1" stop-color="#073b4c"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfc"/><stop offset="1" stop-color="#a8c2cd"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffbd59"/><stop offset="1" stop-color="#f07832"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="13"/></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#9edbe7" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/><rect width="1600" height="900" fill="url(#grid)"/>
<g opacity=".3" fill="#8eb8c7"><path d="M0 330L90 260 175 305 255 225 345 315 435 255 525 330V485H0Z"/><path d="M1100 330L1200 250 1290 300 1380 205 1460 285 1600 220V500H1100Z"/></g>
<g opacity=".45" stroke="#b6f0f7" fill="none" stroke-width="3"><path d="M0 470Q150 445 300 470T600 470T900 470T1200 470T1600 470"/><path d="M0 520Q150 495 300 520T600 520T900 520T1200 520T1600 520"/><path d="M0 580Q150 555 300 580T600 580T900 580T1200 580T1600 580"/></g>
<path d="M0 480Q200 455 400 485T800 480T1200 490T1600 475V900H0Z" fill="url(#water)"/>
<g opacity=".22" stroke="#c6f7ff" stroke-width="4" fill="none"><path d="M0 620Q170 590 340 620T680 620T1020 620T1360 620T1700 620"/><path d="M-50 730Q120 700 290 730T630 730T970 730T1310 730T1650 730"/><path d="M0 815Q180 785 360 815T720 815T1080 815T1440 815"/></g>
<!-- title -->
<text x="72" y="82" fill="#b7f2fa" font-family="Arial,sans-serif" font-size="22" letter-spacing="5" font-weight="700">PUI89  /  FLOOD RESCUE AI</text>
<text x="72" y="139" fill="#ffffff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Amphibious Rescue Robot</text>
<text x="74" y="178" fill="#c5dce6" font-family="Arial,sans-serif" font-size="21">Multimodal sensing • flood reconnaissance • human-supervised response</text>
<!-- robot shadow -->
<ellipse cx="690" cy="692" rx="420" ry="58" fill="#001722" opacity=".55" filter="url(#shadow)"/>
<!-- rear flotation pontoons -->
<path d="M365 564L880 564Q915 565 930 595L905 634Q890 650 850 649L380 638Q345 634 340 607Z" fill="#f07832" stroke="#ffd29b" stroke-width="5"/>
<path d="M390 592L885 600" stroke="#ffe2b7" stroke-width="5" opacity=".7"/>
<!-- tracks -->
<g transform="translate(405 535)"><rect x="0" y="0" width="535" height="114" rx="48" fill="#162d3b" stroke="#9fb9c5" stroke-width="6"/><rect x="20" y="18" width="495" height="78" rx="37" fill="#304d5d" stroke="#5e8290" stroke-width="4"/><g fill="#91acb7" stroke="#102633" stroke-width="4"><circle cx="65" cy="57" r="27"/><circle cx="150" cy="57" r="27"/><circle cx="235" cy="57" r="27"/><circle cx="320" cy="57" r="27"/><circle cx="405" cy="57" r="27"/><circle cx="480" cy="57" r="20"/></g><g fill="#304d5d"><circle cx="65" cy="57" r="10"/><circle cx="150" cy="57" r="10"/><circle cx="235" cy="57" r="10"/><circle cx="320" cy="57" r="10"/><circle cx="405" cy="57" r="10"/></g></g>
<!-- chassis -->
<path d="M390 432Q390 405 426 394L813 394Q854 398 872 432L910 533Q913 548 892 552H416Q390 548 390 526Z" fill="url(#body)" stroke="#e8f7fb" stroke-width="6"/>
<path d="M420 424L835 424L866 507H413Z" fill="#1e5367" stroke="#83c3d3" stroke-width="4"/>
<path d="M450 442H570V493H450Z" fill="#0c2b3a" stroke="#ffae45" stroke-width="4"/><text x="510" y="463" text-anchor="middle" fill="#ffca76" font-family="Arial,sans-serif" font-size="13" font-weight="700">FLOOD</text><text x="510" y="482" text-anchor="middle" fill="#ffca76" font-family="Arial,sans-serif" font-size="13" font-weight="700">RESCUE AI</text>
