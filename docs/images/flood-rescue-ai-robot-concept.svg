<rect x="573" y="244" width="124" height="52" rx="14" fill="#dce8ec" stroke="#ffffff" stroke-width="4"/><rect x="588" y="255" width="42" height="28" rx="7" fill="#143a50"/><circle cx="609" cy="269" r="9" fill="#65e8ff"/><rect x="641" y="255" width="36" height="28" rx="6" fill="#182e3c"/><circle cx="659" cy="269" r="8" fill="#ffab61"/>
<!-- lidar puck -->
<rect x="606" y="222" width="58" height="20" rx="9" fill="#f9fbfc" stroke="#9ab8c4" stroke-width="3"/><path d="M613 222Q635 205 657 222" fill="none" stroke="#74efff" stroke-width="4"/>
<!-- antenna -->
<path d="M674 249L695 208" stroke="#d7e8ed" stroke-width="5"/><circle cx="697" cy="204" r="8" fill="#ffad45"/>
<!-- sensor callout -->
<path d="M704 266L824 223H934" stroke="#a8f3ff" stroke-width="2" fill="none"/><circle cx="704" cy="266" r="5" fill="#a8f3ff"/><text x="944" y="218" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">RGB + THERMAL</text><text x="944" y="243" fill="#c5dce6" font-family="Arial,sans-serif" font-size="15">Camera / depth / LiDAR</text>
<!-- supply pod -->
<rect x="700" y="337" width="126" height="54" rx="12" fill="url(#orange)" stroke="#ffe0b5" stroke-width="4"/><path d="M762 344V383M739 363H785" stroke="#fff0d5" stroke-width="5"/><path d="M825 364L940 338H1010" stroke="#ffc47a" stroke-width="2" fill="none"/><circle cx="825" cy="364" r="5" fill="#ffc47a"/><text x="1020" y="334" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">SUPPLY POD</text><text x="1020" y="358" fill="#c5dce6" font-family="Arial,sans-serif" font-size="15">First-aid / radio / essentials</text>
<!-- rescue beacon marker -->
<g transform="translate(1120 487)"><circle r="43" fill="#ffb74d" opacity=".15"/><circle r="28" fill="none" stroke="#ffcd76" stroke-width="4"/><circle r="8" fill="#ffcd76"/><path d="M0 -48V-72M-48 0H-70M48 0H70" stroke="#ffcd76" stroke-width="3"/></g>
<path d="M1093 487L1030 448H967" fill="none" stroke="#ffcd76" stroke-width="2"/><text x="960" y="425" fill="#ffe0a7" font-family="Arial,sans-serif" font-size="17" font-weight="700">POSSIBLE PERSON</text><text x="960" y="448" fill="#d6e7eb" font-family="Arial,sans-serif" font-size="14">Candidate location — verify</text>
<!-- floating debris -->
<path d="M245 666L305 649L342 665L323 686L261 688Z" fill="#b28d65" stroke="#e4c59a" stroke-width="3"/><path d="M1080 680L1148 660L1190 678L1165 697L1095 698Z" fill="#98785c" stroke="#d6b28a" stroke-width="3"/>
<!-- remote human coordinator panel -->
<rect x="1190" y="520" width="340" height="232" rx="20" fill="#0a2030" stroke="#80c7d8" stroke-width="3"/>
<rect x="1212" y="542" width="296" height="142" rx="10" fill="#16394a" stroke="#477a8c" stroke-width="2"/>
<text x="1232" y="570" fill="#a9f3fa" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" font-weight="700">MISSION REVIEW</text>
<path d="M1234 648L1280 612L1316 630L1360 588L1400 616L1450 580L1488 605" stroke="#70e2ef" stroke-width="3" fill="none"/>
<g fill="#ffbd59"><circle cx="1316" cy="630" r="6"/><circle cx="1400" cy="616" r="6"/><circle cx="1450" cy="580" r="6"/></g>
<rect x="1232" y="659" width="100" height="10" rx="5" fill="#ffb74d"/><rect x="1342" y="659" width="145" height="10" rx="5" fill="#5a8190"/>
<text x="1360" y="718" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">HUMAN COORDINATOR</text>
<!-- lower status ribbon -->
<rect x="60" y="792" width="1480" height="64" rx="16" fill="#071c2a" stroke="#3d7283" stroke-width="2"/>
<circle cx="92" cy="824" r="8" fill="#ffbd59"/><text x="116" y="831" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">AI SUGGESTS</text><text x="252" y="831" fill="#a8cbd6" font-family="Arial,sans-serif" font-size="18">→</text><text x="280" y="831" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">SAFETY CHECKS</text><text x="458" y="831" fill="#a8cbd6" font-family="Arial,sans-serif" font-size="18">→</text><text x="487" y="831" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">HUMAN APPROVAL</text><text x="682" y="831" fill="#a8cbd6" font-family="Arial,sans-serif" font-size="18">→</text><text x="712" y="831" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">AUTHORIZED RESPONSE</text><text x="1130" y="831" fill="#ffcd76" font-family="Arial,sans-serif" font-size="15">CONCEPT ONLY • NOT FIELD-VALIDATED</text>
</svg>