<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Flood Rescue AI — Amphibious Robot Concept</title>
<desc id="desc">A conceptual rescue robot with tracked wheels, flotation pontoons, thermal and RGB cameras, LiDAR, rescue supply pod, in a flooded urban environment. All detections are advisory and reviewed by human responders.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#091a31"/><stop offset="1" stop-color="#17445b"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#167f9b"/><stop offset="1" stop-color="#082b4b"/></linearGradient>
 <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e5e8"/><stop offset=".48" stop-color="#829ca6"/><stop offset="1" stop-color="#344e60"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcb69"/><stop offset="1" stop-color="#f0782e"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8af4ff"/><stop offset="1" stop-color="#087da5"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#70d4df" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/><rect width="1600" height="1000" fill="url(#grid)"/>
