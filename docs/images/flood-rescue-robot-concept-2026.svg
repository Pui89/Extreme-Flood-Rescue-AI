<title id="title">Flood Rescue AI — amphibious reconnaissance robot concept</title><desc id="desc">Original concept illustration of an unmanned amphibious rescue reconnaissance vehicle with camera mast, thermal sensor and mapping interface in a flooded street. It is not a real rescue deployment.</desc>
