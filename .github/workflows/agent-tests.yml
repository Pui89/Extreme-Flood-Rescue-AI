name: Agent unit tests

on:
  push:
    paths:
      - "agents/**"
      - "flood_robot/action/**"
      - "tests/test_project_agent.py"
      - "tests/test_vla_guard_validation.py"
      - ".github/workflows/agent-tests.yml"
      - "docs/AI_AGENT_REVIEW_PLAN.md"
      - "docs/STEP_BY_STEP_TESTING.md"
  pull_request:
    paths:
      - "agents/**"
      - "flood_robot/action/**"
      - "tests/test_project_agent.py"
      - "tests/test_vla_guard_validation.py"
      - ".github/workflows/agent-tests.yml"
      - "docs/AI_AGENT_REVIEW_PLAN.md"
      - "docs/STEP_BY_STEP_TESTING.md"
  workflow_dispatch:
  schedule:
    # Weekly free-first regression run; local time is Thailand UTC+7.
    - cron: "37 2 * * 2"

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax-check agent, VLA guard and tests
        run: python -m py_compile agents/project_agent.py tests/test_project_agent.py flood_robot/action/vla_guard.py tests/test_vla_guard_validation.py
      - name: Run agent and VLA guard regression tests
        run: python -m pytest -q tests/test_project_agent.py tests/test_vla_guard_validation.py
