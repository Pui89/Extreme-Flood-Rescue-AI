name: PUI89 Shared Intelligence Contract

on:
  push:
    branches: [main]
    paths:
      - "schemas/pui89-intelligence-report.schema.json"
      - "tests/test_pui89_shared_report_schema.py"
      - "docs/PUI89_ADVANCED_TECHNOLOGY_ROADMAP.md"
      - ".github/workflows/pui89-shared-intelligence-contract.yml"
  pull_request:
    paths:
      - "schemas/pui89-intelligence-report.schema.json"
      - "tests/test_pui89_shared_report_schema.py"
      - "docs/PUI89_ADVANCED_TECHNOLOGY_ROADMAP.md"
      - ".github/workflows/pui89-shared-intelligence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate shared report contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shared schema JSON
        run: python -m json.tool schemas/pui89-intelligence-report.schema.json > /dev/null
      - name: Run dependency-free schema conformance tests
        run: python -m unittest discover -s tests -p 'test_pui89_shared_report_schema.py' -v
